<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Р-ГРУНТ — калькулятор DAP Анталья</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#009933; --g-d:#007a29; --g-l:#e8f5ec; --g-ll:#f4faf6;
  --ink:#16201a; --ink2:#4a564e; --ink3:#7d8a82; --line:#dfe6e1; --bg:#f6f8f6; --card:#fff;
  --teal:#0097A9; --warn:#b26a00; --warn-l:#fff4e2;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Golos Text",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.logo{width:42px;height:42px;background:var(--g);border-radius:6px;display:grid;place-items:center;flex:none}
.brand{font-weight:800;font-size:20px;letter-spacing:.02em}
.sub{color:var(--ink2);font-size:14px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;font:inherit;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
h2 small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:6px}
.params{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:18px;align-items:end}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.field .hint{font-size:12px;color:var(--ink3);margin-top:4px}
input[type=number],select{font:inherit;border:1px solid #cdd7d0;border-radius:8px;padding:8px 10px;width:100%;background:#fff;color:var(--ink)}
input[type=number]:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px;border-color:var(--g)}
.freight{display:flex;gap:12px;align-items:center}
.freight input[type=range]{flex:1;accent-color:var(--g)}
.freight input[type=number]{width:110px;font-weight:700}
.chips{display:flex;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--g);color:var(--g)}
/* order */
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:150px 1fr 190px 30px;gap:12px;align-items:center;background:var(--g-ll)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:32px;height:36px;border:1px solid #cdd7d0;background:#fff;border-radius:8px;font:inherit;font-size:18px;cursor:pointer;color:var(--ink)}
.qty input{width:60px;text-align:center;font-weight:700}
.qty .ft{width:auto;padding:0 8px;font-size:12px;font-weight:600;color:var(--g)}
.del{border:0;background:none;color:var(--ink3);font-size:20px;cursor:pointer}
.del:hover{color:#c0392b}
.res{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.kv .k{font-size:12px;color:var(--ink3)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.kv.big .v{font-size:19px;color:var(--g-d);font-weight:800}
.kv.dl .v{color:var(--teal)}
.add{margin-top:10px;border:1px dashed var(--g);color:var(--g);background:#fff;border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.add:hover{background:var(--g-l)}
/* summary */
.sum{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{border-radius:10px;padding:12px 14px;background:var(--g-ll);border:1px solid var(--line)}
.tile .k{font-size:12px;color:var(--ink2)}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12px;color:var(--ink3);margin-top:2px}
.tile.main{background:var(--g);border-color:var(--g);color:#fff}
.tile.main .k,.tile.main .s{color:#d8f0df}
.tile.dl .v{color:var(--teal)}
.bar{height:8px;border-radius:4px;background:#e3e9e5;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g)}
.note{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--warn-l);color:var(--warn);font-size:13px;display:none}
.note.on{display:block}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--g);color:#fff;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}
.ok{color:var(--g);font-size:13px;font-weight:600}
/* reference table */
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--ink2);text-align:right;padding:8px 8px;border-bottom:2px solid var(--line);vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
td{padding:7px 8px;border-bottom:1px solid #edf1ee;text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--g-ll);font-weight:700;color:var(--g-d);text-align:left;font-size:13px;letter-spacing:.03em}
td.tot{font-weight:800;color:var(--g-d)}
td.dl{color:var(--teal);font-weight:600}
td .plus{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px;font:inherit;font-size:12px;color:var(--g);cursor:pointer}
tbody tr:hover td{background:#fafcfb}
.foot{font-size:12px;color:var(--ink3);line-height:1.55}
.foot b{color:var(--ink2)}
.tblwrap{overflow-x:auto}
#lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.lockbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 24px;width:100%;max-width:360px}
.lockbox input[type=password]{font:inherit;border:1px solid #cdd7d0;border-radius:8px;padding:10px 12px;width:100%;margin-bottom:10px;font-size:16px}
.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:14px}
#pwErr{color:#c0392b;font-size:13px;text-align:center;margin-top:10px;min-height:1em}
@media (max-width:900px){
  .params{grid-template-columns:1fr 1fr}
  .params .field:first-child{grid-column:1/-1}
  .line{grid-template-columns:1fr 1fr;}
  .line .prod{grid-column:1/-1;order:-1}
  .line{position:relative;padding-right:40px}
  .del{position:absolute;top:14px;right:8px}
  .res{grid-template-columns:repeat(3,1fr)}
  .sum{grid-template-columns:1fr 1fr}
  .tile.main{grid-column:1/-1}
}
</style>
</head>
<body>
<div id="lock"><form id="lockForm" class="lockbox">
  <div class="logo" style="margin:0 auto 12px"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M5 22V4l9 4-9 4" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><path d="M9 22l5-8 3 4 2-3 4 7" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
  <div class="brand" style="text-align:center">Р-ГРУНТ</div>
  <div class="sub" style="text-align:center;margin-bottom:16px">Калькулятор DAP Анталья · DAP Antalya calculator</div>
  <input type="password" id="pw" placeholder="Пароль / Password" autocomplete="current-password">
  <label class="rem"><input type="checkbox" id="pwRem" checked> Запомнить на этом устройстве / Remember</label>
  <button class="btn" id="pwBtn" type="submit" style="width:100%">Открыть / Open</button>
  <div id="pwErr"></div>
</form></div>
<div class="wrap">
<header>
  <div class="logo"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M5 22V4l9 4-9 4" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><path d="M9 22l5-8 3 4 2-3 4 7" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
  <div><div class="brand">Р-ГРУНТ</div><div class="sub" data-t="subtitle"></div></div>
  <div class="spacer"></div>
  <div class="seg" id="cur"><button data-c="EUR" class="on">€</button><button data-c="RUB">₽</button><button data-c="USD">$</button></div>
  <div class="seg" id="lang"><button data-l="ru" class="on">RU</button><button data-l="en">EN</button></div>
</header>

<section class="card">
  <h2 data-t="params"></h2>
  <div class="params">
    <div class="field">
      <label data-t="freight"></label>
      <div class="freight">
        <input type="range" id="fr" min="6500" max="8000" step="50" value="7250">
        <input type="number" id="frn" min="0" step="50" value="7250">
      </div>
      <div class="chips"><button class="chip" data-f="7000">7 000</button><button class="chip" data-f="7250">7 250</button><button class="chip" data-f="7500">7 500</button></div>
    </div>
    <div class="field"><label data-t="rate"></label><input type="number" id="rate" step="0.01" value="90.81"><div class="hint" data-t="rateHint"></div></div>
    <div class="field"><label data-t="rateUsd"></label><input type="number" id="rateUsd" step="0.01" value="82.45"><div class="hint" data-t="rateHint"></div></div>
    <div class="field"><label data-t="disc"></label><input type="number" id="disc" step="0.5" value="0" min="-50" max="80"><div class="hint" data-t="discHint"></div></div>
    <div class="field"><label data-t="extra"></label><input type="number" id="extra" step="50" value="0" min="0"><div class="hint" data-t="extraHint"></div></div>
  </div>
</section>

<section class="card">
  <h2><span data-t="order"></span><small data-t="orderSub"></small></h2>
  <div class="lines" id="lines"></div>
  <button class="add" id="addLine" data-t="addLine"></button>

  <div style="height:16px"></div>
  <div class="sum" id="sum"></div>
  <div class="note" id="note"></div>
  <div class="actions">
    <button class="btn" id="copy" data-t="copy"></button>
    <button class="btn ghost" id="reset" data-t="reset"></button>
    <span class="ok" id="copied"></span>
  </div>
</section>

<section class="card">
  <h2><span data-t="ref"></span><small data-t="refSub"></small></h2>
  <div class="tabs seg" id="refTabs" style="display:inline-flex"></div>
  <div class="tblwrap"><table id="ref"></table></div>
</section>

<div class="foot" id="foot"></div>
</div>

const plugName={ru:["27/20 стандартное отверстие","27/22 стандартное отверстие","27/20 в кассетах"],en:["27/20 standard hole","27/22 standard hole","27/20 in trays"]};

let lang="ru", cur="EUR", refCat="mat";
let lines=[];
const $=id=>document.getElementById(id);
const st={get fr(){return +$("frn").value||0},get rate(){return +$("rate").value||1},get usd(){return +$("rateUsd").value||1},get disc(){return +$("disc").value||0},get extra(){return +$("extra").value||0}};

function pname(p){
  if(p.cat==="plug"){const idx=P.filter(x=>x.cat==="plug").indexOf(p);return "PLANTOP PLUG "+plugName[lang][idx];}
  return p.line.replace(" NG2.0","")+" NG2.0 · "+p.size;
}
function unitMult(p){return p.cat==="plug"?1000:1}
function fxTo(eur,c){return c==="EUR"?eur:(c==="RUB"?eur*st.rate:eur*st.rate/st.usd)}
function fx(eur){return fxTo(eur,cur)}
const SYM={EUR:"€",RUB:"₽",USD:"$"};
function sym(c){return SYM[c||cur]}
function others(eur){return ["EUR","USD","RUB"].filter(c=>c!==cur).map(c=>fmt(fxTo(eur,c),0)+" "+SYM[c]).join(" · ")}
function fmt(v,d){return v.toLocaleString(lang==="ru"?"ru-RU":"en-GB",{minimumFractionDigits:d,maximumFractionDigits:d})}
function money(eur,dEur){const v=fx(eur);let d=dEur;if(cur==="RUB")d=Math.max(0,dEur-2);return fmt(v,d)+" "+sym()}
function unitDec(p){return p.cat==="mat"?2:(p.cat==="block"?3:2)}
function priceEur(p){return p.rub*(1-st.disc/100)/st.rate}
function truckCost(){return st.fr+st.extra}

/* ---------- order ---------- */
function calc(){
  const rows=lines.map(l=>{const p=P[l.pid];const pal=Math.max(0,Math.round(l.pal||0));return {l,p,pal,pcs:pal*p.pcsPal,m3:pal*p.m3Pal,share:pal/p.palTruck}});
  const totShare=rows.reduce((a,r)=>a+r.share,0);
  const trucks=totShare>0?Math.ceil(totShare-1e-9):0;
  const freight=trucks*truckCost();
  rows.forEach(r=>{
    r.prod=r.pcs*priceEur(r.p);
    r.dlv=totShare>0?freight*r.share/totShare:0;
    r.uPrice=priceEur(r.p)*unitMult(r.p);
    r.uDlv=r.pcs?r.dlv/r.pcs*unitMult(r.p):0;
    r.uTot=r.uPrice+r.uDlv;
    r.m3Tot=r.m3?(r.prod+r.dlv)/r.m3:0;
  });
  const prod=rows.reduce((a,r)=>a+r.prod,0);
  return {rows,totShare,trucks,freight,prod};
}

function lineHTML(l,i){
  const p=P[l.pid], t=T[lang];
  const opts=P.filter(x=>x.cat===p.cat).map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${pname(x)}</option>`).join("");
  const cats=["mat","block","plug"].map(c=>`<option value="${c}" ${c===p.cat?"selected":""}>${t.cat[c]}</option>`).join("");
  return `<div class="line" data-i="${i}">
    <select class="cat">${cats}</select>
    <select class="prod">${opts}</select>
    <div class="qty"><button class="mn">−</button><input type="number" class="pal" min="1" step="1" value="${l.pal}"><button class="pl">+</button><button class="ft" title="${p.palTruck} ${t.pal}">${t.fullTruck}</button></div>
    <button class="del" title="×">×</button>
    <div class="res"></div>
  </div>`;
}
function renderLines(){
  $("lines").innerHTML=lines.map(lineHTML).join("");
  update();
}
function update(){
  const t=T[lang], c=calc();
  // per line results
  c.rows.forEach((r,i)=>{
    const el=document.querySelector(`.line[data-i="${i}"] .res`); if(!el)return;
    const u=t.unit[r.p.cat], d=unitDec(r.p);
    el.innerHTML=`
      <div class="kv"><div class="k">${t.pcs}</div><div class="v">${fmt(r.pcs,0)}</div></div>
      <div class="kv"><div class="k">${t.vol}</div><div class="v">${fmt(r.m3,1)} ${t.m3}</div></div>
      <div class="kv"><div class="k">${t.price} ${t.per} ${u}</div><div class="v">${money(r.uPrice,d)}</div></div>
      <div class="kv dl"><div class="k">${t.dlv} ${t.per} ${u}</div><div class="v">${money(r.uDlv,d)}</div></div>
      <div class="kv big"><div class="k">${t.total} ${t.per} ${u}</div><div class="v">${money(r.uTot,d)}</div></div>
      <div class="kv"><div class="k">${t.lineSum} · ${money(r.m3Tot,0)} ${t.perM3}</div><div class="v">${money(r.prod+r.dlv,0)}</div></div>`;
  });
  // summary
  const tot=c.prod+c.freight, load=c.trucks?c.totShare/c.trucks*100:0;
  $("sum").innerHTML=`
    <div class="tile"><div class="k">${t.trucks}</div><div class="v">${c.trucks}</div><div class="s">${t.load} ${fmt(load,0)}%</div><div class="bar"><i style="width:${Math.min(100,load)}%"></i></div></div>
    <div class="tile"><div class="k">${t.prod}</div><div class="v">${money(c.prod,0)}</div><div class="s">FCA</div></div>
    <div class="tile dl"><div class="k">${t.delivery}</div><div class="v">${money(c.freight,0)}</div><div class="s">${c.trucks} × ${money(truckCost(),0)}</div></div>
    <div class="tile"><div class="k">${t.share}</div><div class="v">${tot?fmt(c.freight/tot*100,1):"0"}%</div><div class="s">&nbsp;</div></div>
    <div class="tile main"><div class="k">${t.dap}</div><div class="v">${money(tot,0)}</div><div class="s">${others(tot)}</div></div>`;
  // free space hint
  const note=$("note");
  const free=c.trucks-c.totShare;
  if(c.rows.length&&free>0.04){
    const last=c.rows[c.rows.length-1].p;
    const n=Math.floor(free*last.palTruck+1e-9);
    note.textContent=t.freeSpace(n,fmt(free*100,0)); note.classList.toggle("on",n>=1);
  } else note.classList.remove("on");
  renderRef();
}

$("lines").addEventListener("change",e=>{
  const row=e.target.closest(".line"); if(!row)return; const i=+row.dataset.i;
  if(e.target.classList.contains("cat")){lines[i].pid=P.find(x=>x.cat===e.target.value).id;lines[i].pal=P[lines[i].pid].palTruck;renderLines();}
  else if(e.target.classList.contains("prod")){lines[i].pid=+e.target.value;renderLines();}
});
$("lines").addEventListener("input",e=>{
  if(!e.target.classList.contains("pal"))return;
  const i=+e.target.closest(".line").dataset.i; lines[i].pal=Math.max(0,Math.round(+e.target.value||0)); update();
});
$("lines").addEventListener("click",e=>{
  const row=e.target.closest(".line"); if(!row)return; const i=+row.dataset.i, l=lines[i];
  if(e.target.classList.contains("mn")){l.pal=Math.max(1,l.pal-1);row.querySelector(".pal").value=l.pal;update();}
  else if(e.target.classList.contains("pl")){l.pal=l.pal+1;row.querySelector(".pal").value=l.pal;update();}
  else if(e.target.classList.contains("ft")){l.pal=P[l.pid].palTruck;row.querySelector(".pal").value=l.pal;update();}
  else if(e.target.classList.contains("del")){lines.splice(i,1);renderLines();}
});
$("addLine").onclick=()=>{const last=lines[lines.length-1];const pid=last?last.pid:0;lines.push({pid,pal:1});renderLines();};
$("reset").onclick=()=>{lines=[{pid:0,pal:P[0].palTruck}];renderLines();};

/* ---------- reference ---------- */
function renderRef(){
  const t=T[lang];
  $("refTabs").innerHTML=["mat","block","plug"].map(c=>`<button data-c="${c}" class="${c===refCat?"on":""}">${t.cat[c]}</button>`).join("");
  const list=P.filter(p=>p.cat===refCat);
  const u=t.unit[refCat];
  let h=`<thead><tr><th>${t.th.name}</th><th>${t.th.pp}</th><th>${t.th.pt}</th><th>${t.th.price}<br>${sym()}/${u}</th><th>${t.th.dlv}<br>${sym()}/${u}</th><th>${t.th.tot}<br>${sym()}/${u}</th><th>${t.th.m3}<br>${sym()}/${t.m3}</th><th></th></tr></thead><tbody>`;
  let grp="";
  list.forEach(p=>{
    if(refCat!=="plug"&&p.line!==grp){grp=p.line;h+=`<tr class="grp"><td colspan="8">${grp}</td></tr>`;}
    const pcs=p.palTruck*p.pcsPal, m3=p.palTruck*p.m3Pal;
    const up=priceEur(p)*unitMult(p), ud=truckCost()/pcs*unitMult(p), d=unitDec(p);
    const m3t=(pcs*priceEur(p)+truckCost())/m3;
    const nm=refCat==="plug"?pname(p):p.size;
    h+=`<tr><td>${nm}</td><td>${fmt(p.pcsPal,0)}</td><td>${p.palTruck}</td><td>${money(up,d)}</td><td class="dl">${money(ud,d)}</td><td class="tot">${money(up+ud,d)}</td><td>${money(m3t,0)}</td><td><button class="plus" data-id="${p.id}">+</button></td></tr>`;
  });
  $("ref").innerHTML=h+"</tbody>";
}
$("refTabs").addEventListener("click",e=>{const c=e.target.dataset.c;if(c){refCat=c;renderRef();}});
$("ref").addEventListener("click",e=>{
  const id=e.target.dataset.id; if(id===undefined)return; const p=P[+id];
  lines.push({pid:p.id,pal:p.palTruck}); renderLines();
  document.querySelector(`.line[data-i="${lines.length-1}"]`).scrollIntoView({behavior:"smooth",block:"center"});
});

/* ---------- params ---------- */
function setFr(v){$("fr").value=v;$("frn").value=v;update();}
$("fr").oninput=e=>setFr(e.target.value);
$("frn").oninput=e=>{$("fr").value=e.target.value;update();};
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>setFr(b.dataset.f));
["rate","rateUsd","disc","extra"].forEach(id=>$(id).oninput=update);

function applyLang(){
  const t=T[lang]; document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t[el.dataset.t];if(typeof v==="string")el.textContent=v;});
  $("foot").innerHTML=t.foot;
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  renderLines();
}
$("lang").onclick=e=>{if(e.target.dataset.l){lang=e.target.dataset.l;applyLang();}};
$("cur").onclick=e=>{if(e.target.dataset.c){cur=e.target.dataset.c;document.querySelectorAll("#cur button").forEach(b=>b.classList.toggle("on",b.dataset.c===cur));update();}};

/* ---------- copy ---------- */
$("copy").onclick=async()=>{
  const t=T[lang], c=calc(), tot=c.prod+c.freight;
  let s=`${t.copyHead}\n${t.copyFreight}: ${money(truckCost(),0)} ${t.perTruck}; ${t.copyRate} ${fmt(st.rate,2)} ₽/€, ${fmt(st.usd,2)} ₽/$${st.disc?`; −${st.disc}%`:""}\n\n`;
  c.rows.forEach(r=>{const u=t.unit[r.p.cat],d=unitDec(r.p);
    s+=`• ${pname(r.p)} — ${r.pal} ${t.pal}, ${fmt(r.pcs,0)} ${t.unitPc[r.p.cat]}\n   ${t.price} ${money(r.uPrice,d)} + ${t.dlv.toLowerCase()} ${money(r.uDlv,d)} = ${money(r.uTot,d)} ${t.per} ${u}\n   ${t.lineSum}: ${money(r.prod+r.dlv,0)}\n`;});
  s+=`\n${t.trucks}: ${c.trucks} (${t.load} ${fmt(c.trucks?c.totShare/c.trucks*100:0,0)}%)\n${t.prod}: ${money(c.prod,0)}\n${t.delivery}: ${money(c.freight,0)}\n${t.dap}: ${money(tot,0)} (${others(tot)})`;
  try{await navigator.clipboard.writeText(s);$("copied").textContent=t.copied;}catch(err){$("copied").textContent=t.copyFail;}
  setTimeout(()=>$("copied").textContent="",2500);
};

function boot(d){P=d;P.forEach((p,i)=>{p.id=i;});lines=[{pid:0,pal:P[0].palTruck}];applyLang();$("lock").style.display="none";}
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:ENC.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const LSK="rg-dap-antalya-pw";
async function tryPw(pw,remember){
  try{const d=await unlock(pw);try{remember?localStorage.setItem(LSK,pw):localStorage.removeItem(LSK);}catch(e){}boot(d);return true;}
  catch(e){return false;}
}
if(!ENC){boot(DATA);}
else{
  $("lock").style.display="flex";
  let saved=null;try{saved=localStorage.getItem(LSK);}catch(e){}
  (async()=>{ if(saved && await tryPw(saved,true)) return; $("pw").focus(); })();
  $("lockForm").addEventListener("submit",async e=>{
    e.preventDefault(); $("pwErr").textContent=""; $("pwBtn").disabled=true;
    const ok=await tryPw($("pw").value,$("pwRem").checked);
    $("pwBtn").disabled=false; if(!ok){$("pwErr").textContent="Неверный пароль / Wrong password";$("pw").select();}
  });
}
